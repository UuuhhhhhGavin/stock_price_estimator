# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 21 * * *" #30 21 should run at 3:30 CST

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Debug pip
      run: |
        pip list
        python - <<EOF
        try:
            import oipd
            print("oipd import OK")
        except Exception as e:
            print("oipd import FAILED:", e)
        EOF
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run the stock analysis script
      run: |
        python stock_analyzer.py
    - name: Generate JSON for GitHub Pages
      run: |
        python scripts/convert_excel_to_json.py
    - name: Commit results 
      run: | 
        git config --global user.name "github-actions" 
        git config --global user.email "github-actions@github.com" 
        git add "sp500_options_analysis.xlsx" "docs/data.json"  # Add both Excel and JSON files
        git commit -m "Daily update" || echo "No changes" 
        git push
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
